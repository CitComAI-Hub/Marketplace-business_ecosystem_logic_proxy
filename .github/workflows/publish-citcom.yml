name: Publish CITCOM Marketplace

# Al crear un tag sobre un commit de feat/citcom, compila vrain_BAE-Frontend (mismo tag),
# copia el resultado en docker/proxy-themes/bae-frontend y publica la imagen
# en ghcr.io/citcomai-hub/citcom-marketplace con el nombre del tag como versión.

on:
  push:
    tags:
      - '*'

env:
  FRONTEND_REPO: CitComAI-Hub/vrain_BAE-Frontend
  PROXY_BRANCH: feat/citcom
  IMAGE: ghcr.io/citcomai-hub/citcom-marketplace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout proxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag belongs to ${{ env.PROXY_BRANCH }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$PROXY_BRANCH"; then
            echo "::error::El tag ${GITHUB_REF_NAME} no está en la rama ${PROXY_BRANCH}; no se publica."
            exit 1
          fi

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ github.ref_name }}
          # Mismo tag que el del proxy. Solo hace falta el secret si el repo es privado
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          path: frontend

      - name: Build frontend (docker compose)
        working-directory: frontend
        run: |
          mkdir -p dist
          docker compose run --rm build-frontend
          test -f dist/bae-frontend/index.html

      - name: Copy frontend build into proxy
        run: |
          rm -rf docker/proxy-themes/bae-frontend
          mkdir -p docker/proxy-themes docker/proxy-locales docker/proxy-static docker/proxy-data
          sudo chown -R "$USER" frontend/dist
          cp -r frontend/dist/bae-frontend docker/proxy-themes/bae-frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag

      - name: Build and push Docker
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
